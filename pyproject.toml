[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gdextenser-xmodalcite"
version = "0.1.0"
description = "把文本断言与图像区域对应，标出引用错位"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "gdextenser" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://gdextenser.github.io"
Repository = "https://github.com/gdextenser/xmodalcite"
Issues = "https://github.com/gdextenser/xmodalcite/issues"

[project.scripts]
xmodalcite = "xmodalcite:main"

[tool.setuptools]
py-modules = ["xmodalcite"]
